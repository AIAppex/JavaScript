<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">;
    <title>Lista de Tarefas</title>
    <style> .concluida { text-decoration: line-through; color: grey; } .nao-concluida { color: black; } </style>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    <input type="text" id="descricaoInput" placeholder="Descrição da nova tarefa">
    <button id="adicionarButton">Adicionar</button>
    <ul id="listaTarefas"></ul>

    <script>
        const tarefas = [];

        function renderizarTarefas() {
            const listaTarefas = document.getElementById('listaTarefas');
            listaTarefas.innerHTML = '';
            tarefas.forEach((tarefa, index) => {
                const li = document.createElement('li');
                li.className = tarefa.status ? 'concluida' : 'nao-concluida';
                li.innerHTML = `
                    <input type="checkbox" ${tarefa.status ? 'checked' : ''} onchange="alternarStatus(${index})">
                    ${tarefa.descricao}
                `;
                listaTarefas.appendChild(li);
            });
        }

        function adicionarTarefa() {
            const descricaoInput = document.getElementById('descricaoInput').value.trim();
            if (descricaoInput) {
                tarefas.push({ descricao: descricaoInput, status: false });
                document.getElementById('descricaoInput').value = '';
                renderizarTarefas();
            }
        }

        function alternarStatus(index) {
            tarefas[index].status = !tarefas[index].status;
            renderizarTarefas();
        }

        document.getElementById('adicionarButton').addEventListener('click', adicionarTarefa);
    </script>
</body>
</html>
