<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Usuários no GitHub</title>
    <style>
        .user-list { list-style-type: none; padding: 0; }
        .user-item { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Busca de Usuários no GitHub</h1>
    <input type="text" id="usernameInput" placeholder="Digite o nome do usuário">
    <button id="searchButton">Buscar</button>
    <ul id="userList"></ul>
    <p id="noResultsMessage" style="display:none;">Não foram encontrados usuários para esta pesquisa.</p>

    <script>
        async function buscarUsuarios() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                const response = await fetch(`https://api.github.com/search/users?q=${username}`);
                const data = await response.json();
                const userList = document.getElementById('userList');
                const noResultsMessage = document.getElementById('noResultsMessage');
                userList.innerHTML = '';

                if (data.total_count > 0) {
                    noResultsMessage.style.display = 'none';
                    data.items.forEach(user => {
                        const li = document.createElement('li');
                        li.className = 'user-item';
                        li.innerHTML = `
                            <img src="${user.avatar_url}" alt="${user.login}" width="50" height="50">
                            <a href="${user.html_url}" target="_blank">${user.login}</a>
                        `;
                        userList.appendChild(li);
                    });
                } else {
                    noResultsMessage.style.display = 'block';
                }
            }
        }

        document.getElementById('searchButton').addEventListener('click', buscarUsuarios);
    </script>
</body>
</html>
